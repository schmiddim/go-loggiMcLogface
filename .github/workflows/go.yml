name: Build, Test and Release
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual release trigger'
        required: false
        default: 'manual release'

permissions:
  contents: write

jobs:
  build_and_test:
    name: Build & Test the Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Build
        run: go build -v -o exporter .
      - name: Test
        run: go test -v -coverprofile cover.out ./...
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Release & Push Docker Image
    runs-on: ubuntu-latest
    needs: build_and_test
    # Release only on manual dispatch or when a Dependabot PR merge landed on master.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.author.name, 'dependabot') ||
      contains(github.event.head_commit.message, 'dependabot')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next semver tag
        id: semver
        run: |
          git fetch --tags --force
          LATEST=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="0.0.0"
          fi
          echo "Latest tag: $LATEST"
          PREFIX=""
          VER="$LATEST"
          case "$LATEST" in
            v*) PREFIX="v"; VER="${LATEST#v}";;
          esac
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEW_TAG="${PREFIX}${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.semver.outputs.new_tag }}"
          git push origin "${{ steps.semver.outputs.new_tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            schmiddim/go-loggimclogface:${{ steps.semver.outputs.new_tag }}
          platforms: linux/amd64 #,linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.semver.outputs.new_tag }}" \
            --title "${{ steps.semver.outputs.new_tag }}" \
            --generate-notes
